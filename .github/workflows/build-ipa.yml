name: Build StarkHUD IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project StarkHUD.xcodeproj \
            -scheme StarkHUD \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/StarkHUD.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/StarkHUD.xcarchive/Products/Applications/StarkHUD.app build/Payload/
          cd build
          zip -r StarkHUD.ipa Payload/
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarkHUD-iOS
          path: build/StarkHUD.ipa
          retention-days: 14
