name: Build & Dispatch Hefesto IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Hefesto IPA
    runs-on: macos-13

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_15.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app
          elif [ -d "/Applications/Xcode_15.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.1.app
          elif [ -d "/Applications/Xcode_15.0.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.0.1.app
          fi
          xcodebuild -version

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project Hefesto.xcodeproj \
            -scheme Hefesto \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Hefesto.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Hefesto.xcarchive/Products/Applications/Hefesto.app build/Payload/
          cd build
          zip -r -9 Hefesto.ipa Payload
          ls -lh Hefesto.ipa
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hefesto-iOS
          path: build/Hefesto.ipa
          retention-days: 14

      - name: Send IPA directly to Telegram
        env:
          BOT_TOKEN: "9096105002:AAFskEdZZ9Yh3Wkw-W1lhi0iBZHevWIp-z8"
          CHAT_ID: "8452536526"
        run: |
          if [ -f build/Hefesto.ipa ]; then
            echo "Enviando Hefesto.ipa a Telegram..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
              -F chat_id="${CHAT_ID}" \
              -F document=@build/Hefesto.ipa \
              -F caption="🔨 Hefesto 3D - Receptor Holográfico de Ingeniería (Compilado para iPhone 16)" \
              https://api.telegram.org/bot${BOT_TOKEN}/sendDocument)
            echo "$RESPONSE"
          else
            echo "Error: build/Hefesto.ipa no encontrado."
            exit 1
          fi
